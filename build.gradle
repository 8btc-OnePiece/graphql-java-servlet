buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://repo.spring.io/plugins-release' }
    }
    dependencies {
        classpath "com.jfrog.bintray.gradle:gradle-bintray-plugin:1.+"
        classpath 'net.researchgate:gradle-release:2.7.0'
    }
}

plugins {
    id 'net.researchgate.release' version '2.7.0'
    id 'io.franzbecker.gradle-lombok' version '3.2.0' apply false
    id "com.jfrog.artifactory" version "4.11.0" apply false
    id "biz.aQute.bnd.builder" version "6.3.1" apply false
}

subprojects {
    apply plugin: 'idea'
    apply plugin: 'java'
    // 要执行子build.gradle中的uploadArchives，得加入maven插件
    apply plugin: 'maven-publish'
    apply plugin: "com.jfrog.bintray"
    apply plugin: 'io.franzbecker.gradle-lombok'
    apply plugin: 'com.jfrog.artifactory'

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url "https://repo.spring.io/libs-milestone" }
    }

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    compileJava {
        sourceCompatibility = SOURCE_COMPATIBILITY
        targetCompatibility = TARGET_COMPATIBILITY
    }

    compileJava.dependsOn(processResources)

    lombok {
        version = "1.18.24"
        sha256 = ""
    }

   task sourcesJar(type: Jar) {
        from sourceSets.main.allJava
        archiveClassifier = 'sources'
    }

    afterEvaluate {
        publishing {
            publications {
                snapshot(MavenPublication) {
                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }
                    groupId = 'com.graphql-java-kickstart'
                    version = version
                    artifact sourcesJar
                    from components.java
                }
            }
            repositories {
                maven {
                    name = "snapshot"
                    credentials {
                        username = System.env.NEXUS_USERNAME ?: project.findProperty('NEXUS_PASSWORD') ?: ''
                        password = System.env.NEXUS_PASSWORD ?: project.findProperty('NEXUS_PASSWORD') ?: ''
                    }
                    allowInsecureProtocol true
                    url = 'https://nexus.8btc-ops.com/repository/maven-snapshots/'
                }
            }
        }
    }
}

release {
    tagTemplate = 'v${version}'
    failOnPublishNeeded = false
    ignoredSnapshotDependencies = ['com.graphql-java-kickstart:graphql-java-servlet']
}

task build {
    dependsOn subprojects.findResults { it.tasks.findByName('assemble') }
    dependsOn subprojects.findResults { it.tasks.findByName('check') }
    dependsOn subprojects.findResults { it.tasks.findByName('bintray') }
}

wrapper {
    gradleVersion = "${GRADLE_WRAPPER_VER}"
}
