buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://repo.spring.io/plugins-release' }
//        jcenter()
//        maven { url "https://dl.bintray.com/graphql-java-kickstart/releases" }
//        maven { url "https://plugins.gradle.org/m2/" }
//        maven { url 'https://repo.spring.io/plugins-release' }
    }
}

plugins {
    id "biz.aQute.bnd.builder" version "6.4.0" apply false
    id "org.sonarqube" version "4.4.1.3373"
    id "jacoco"
//    id "io.github.gradle-nexus.publish-plugin" version '1.3.0'
}

sonarqube {
    properties {
        property "sonar.projectKey", "graphql-java-kickstart_graphql-java-servlet"
        property "sonar.organization", "graphql-java-kickstart"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

subprojects {
    apply plugin: 'idea'
    apply plugin: 'jacoco'
    apply plugin: 'org.sonarqube'
    apply plugin: 'java'
    // 要执行子build.gradle中的uploadArchives，得加入maven插件
    apply plugin: 'maven-publish'
//    apply plugin: 'signing'

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url "https://repo.spring.io/libs-milestone" }
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:$LIB_LOMBOK_VER"
        annotationProcessor "org.projectlombok:lombok:$LIB_LOMBOK_VER"

        testCompileOnly "org.projectlombok:lombok:$LIB_LOMBOK_VER"
        testAnnotationProcessor "org.projectlombok:lombok:$LIB_LOMBOK_VER"
    }

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    compileJava {
        sourceCompatibility = SOURCE_COMPATIBILITY
        targetCompatibility = TARGET_COMPATIBILITY
    }

    compileTestJava {
        sourceCompatibility = SOURCE_COMPATIBILITY_TEST
        targetCompatibility = TARGET_COMPATIBILITY_TEST
    }

    compileJava.dependsOn(processResources)

    test {
        useJUnitPlatform()

        afterSuite { desc, result ->
            if (!desc.parent) {
                if (result.testCount == 0) {
                    throw new IllegalStateException("No tests were found. Failing the build")
                }
            }
        }
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = false
            csv.required = false
        }
    }

    if (!it.name.startsWith('example')) {
        jar {
            from "LICENSE.md"
        }

        java {
            withSourcesJar()
            withJavadocJar()
        }

//        if (!version.toString().endsWith('-SNAPSHOT')) {
//            ext["signing.keyId"] = System.env.SIGNING_KEY_ID
//            ext["signing.password"] = System.env.SIGNING_PASSWORD
//            ext["signing.secretKeyRingFile"] = System.env.SIGNING_SECRET_KEY_RING_FILE
//
//            signing {
//                sign publishing.publications
//            }
//        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    version version
                    from components.java

                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }

                    pom {
                        name = PROJECT_NAME
                        description = 'relay.js-compatible GraphQL servlet'
                    }
                }


            }

            repositories {
//                    maven {
//                        name = 'OnePiece'
//                        url 'https://nexus.8btc-ops.com/repository/maven-releases/'
//                        credentials {
//                            username = System.env.MAVEN_CENTRAL_USER
//                            password = System.env.MAVEN_CENTRAL_PASSWORD
//                        }
//                    }
                mavenLocal()
            }
        }
    }
}

